name: Build signed APK (Police Chief)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-android.yml'
      - 'app/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'

permissions:
  contents: write

concurrency:
  group: build-signed-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # All signing material comes from repository Secrets (Settings -> Secrets and variables -> Actions):
      #   KEYSTORE_B64    = base64 of the PKCS12 keystore (content of my-upload-key.jks.b64)
      #   STORE_PASSWORD  = keystore store password
      #   KEY_PASSWORD    = key password
      KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
      STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'

      - name: Accept Android SDK licenses (insurance for missing components)
        run: |
          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-36.1" >/dev/null 2>&1 || true
          else
            echo "sdkmanager not found; relying on AGP auto-install"
          fi

      - name: Restore permanent signing key from Secrets
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_B64:-}" ] || [ -z "${STORE_PASSWORD:-}" ] || [ -z "${KEY_PASSWORD:-}" ]; then
            echo "::error::Missing secrets. Add KEYSTORE_B64, STORE_PASSWORD and KEY_PASSWORD in Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          printf '%s' "$KEYSTORE_B64" | tr -d '[:space:]' | base64 -d > "$GITHUB_WORKSPACE/my-upload-key.jks"
          keytool -list -keystore "$GITHUB_WORKSPACE/my-upload-key.jks" -storepass "$STORE_PASSWORD" | head -5

      - name: Build signed release APK
        run: |
          set -o pipefail
          export KEYSTORE_PATH="$GITHUB_WORKSPACE/my-upload-key.jks"
          gradle --no-daemon :app:assembleRelease 2>&1 | tee "$GITHUB_WORKSPACE/gradle-build.log"

      - name: Verify signature and read certificate
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          APKSIGNER="$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)"
          "$APKSIGNER" verify --verbose "$APK" >/dev/null && echo "signature OK"
          keytool -printcert -jarfile "$APK" > "$GITHUB_WORKSPACE/apk-certs.txt"
          cat "$GITHUB_WORKSPACE/apk-certs.txt"
          SHA256="$(grep -m1 'SHA256:' "$GITHUB_WORKSPACE/apk-certs.txt" | sed 's/.*SHA256:[[:space:]]*//')"
          echo "APK_CERT_SHA256=$SHA256" >> "$GITHUB_ENV"

      - name: Prepare deliverables
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          cp "$APK" PoliceChief-v1.0-release.apk
          cp "$GITHUB_WORKSPACE/my-upload-key.jks" upload-keystore.jks
          cat > SIGNING-INFO.txt <<'EOF'
          ============================================================
           Police Chief / رئیس پلیس - Upload signing key info
          ============================================================
          Keystore file : upload-keystore.jks (PKCS12)
          Alias         : upload
          Passwords     : stored in repository Secrets (STORE_PASSWORD / KEY_PASSWORD)
                          and in your local secure copy of SIGNING-INFO.txt.
                          (Not printed here because this repository is public.)
          Algorithm     : RSA 4096, valid 10000 days (until ~2054)

          IMPORTANT
          - Keep your local SIGNING-INFO.txt and the passwords safe.
            Every future update on Cafe Bazaar must be signed with THIS EXACT key.
          - upload-keystore.jks here is safe to download (it is useless
            without the passwords, which are not in this repository).
          ============================================================
          EOF
          ls -la

      - name: One-time delivery upload
        id: delivery
        run: |
          set -uo pipefail
          FILEIO_URL=""
          ZEROX0_URL=""
          TMPF_URL=""
          for i in 1 2 3; do
            R=$(curl -s -m 120 -H "Accept: application/json" -F "file=@PoliceChief-v1.0-release.apk" "https://file.io/" || true)
            FILEIO_URL=$(echo "$R" | grep -o '"link":"[^"]*"' | head -1 | cut -d'"' -f4)
            [ -n "$FILEIO_URL" ] && break
            sleep 5
          done
          if [ -z "$FILEIO_URL" ]; then
            ZEROX0_URL=$(curl -s -m 120 -A "CI-delivery/1.0" -F "file=@PoliceChief-v1.0-release.apk" "https://0x0.st" || true)
          fi
          if [ -z "$FILEIO_URL" ] && [ -z "$ZEROX0_URL" ]; then
            R=$(curl -s -m 120 -F "file=@PoliceChief-v1.0-release.apk" "https://tmpfiles.org/api/v1/upload" || true)
            TMPF_URL=$(echo "$R" | grep -o '"url":"[^"]*"' | head -1 | cut -d'"' -f4 | sed 's#tmpfiles.org/#tmpfiles.org/dl/#')
          fi
          echo "FILEIO_URL=$FILEIO_URL" >> "$GITHUB_ENV"
          echo "ZEROX0_URL=$ZEROX0_URL" >> "$GITHUB_ENV"
          echo "TMPF_URL=$TMPF_URL" >> "$GITHUB_ENV"
          echo "file.io : $FILEIO_URL"
          echo "0x0.st  : $ZEROX0_URL"
          echo "tmpfiles: $TMPF_URL"

      - name: Publish APK to apk-delivery branch
        run: |
          set -uo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B apk-delivery
          mkdir -p delivery
          cp PoliceChief-v1.0-release.apk delivery/
          {
            echo "APK_FILE=PoliceChief-v1.0-release.apk"
            echo "BUILT_AT=$(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo "APK_CERT_SHA256=$APK_CERT_SHA256"
            echo "FILEIO_URL=$FILEIO_URL"
            echo "ZEROX0_URL=$ZEROX0_URL"
            echo "TMPF_URL=$TMPF_URL"
          } > delivery/DELIVERY-URLS.txt
          git add -f delivery
          git commit -m "Signed release APK v1.0 (build ${{ github.run_number }}) [skip ci]"
          git push -f origin apk-delivery

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PoliceChief-signed-APK
          path: |
            PoliceChief-v1.0-release.apk
            upload-keystore.jks
            SIGNING-INFO.txt
          retention-days: 90

      - name: Create or update GitHub Release v1.0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          gh release create v1.0 --target main \
            --title "رئیس پلیس v1.0 — APK امضاشده" \
            --notes "APK امضاشده برای انتشار در کافه بازار. اطلاعات کلید امضا در SIGNING-INFO.txt" || true
          gh release upload v1.0 PoliceChief-v1.0-release.apk upload-keystore.jks SIGNING-INFO.txt --clobber

      - name: Push failure log for debugging
        if: failure()
        run: |
          set -uo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B ci-logs
          mkdir -p ci-logs
          {
            echo "run_id=${{ github.run_id }}"
            echo "event=${{ github.event_name }}"
            echo "--- tail of gradle-build.log ---"
            tail -c 80000 "$GITHUB_WORKSPACE/gradle-build.log" 2>/dev/null || echo "(no gradle log)"
          } > ci-logs/build-log-tail.txt
          git add -f ci-logs
          git commit -m "CI failure log (build ${{ github.run_number }}) [skip ci]" || true
          git push -f origin ci-logs || true
