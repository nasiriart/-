name: Build signed APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/build-android.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'
      - name: Generate signing key
        shell: bash
        run: |
          set -euo pipefail
          STORE_PASS="$(openssl rand -hex 24)"
          KEY_PASS="$(openssl rand -hex 24)"
          keytool -genkeypair -v -keystore "$GITHUB_WORKSPACE/my-upload-key.jks" -storepass "$STORE_PASS" -keypass "$KEY_PASS" -alias upload -keyalg RSA -keysize 4096 -validity 10000 -dname "CN=Police Chief, OU=Android, O=Nasiri, C=IR"
          echo "STORE_PASSWORD=$STORE_PASS" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=$KEY_PASS" >> "$GITHUB_ENV"
          {
            echo "Alias: upload"
            echo "Store password: $STORE_PASS"
            echo "Key password: $KEY_PASS"
            echo "Back up this file and passwords securely. All future app updates must use this exact signing key."
          } > SIGNING-INFO.txt
      - name: Build release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ env.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ env.KEY_PASSWORD }}
        run: gradle --no-daemon :app:assembleRelease
      - name: Verify signature
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: police-chief-signed-release
          path: |
            app/build/outputs/apk/release/app-release.apk
            my-upload-key.jks
            SIGNING-INFO.txt
          retention-days: 30
